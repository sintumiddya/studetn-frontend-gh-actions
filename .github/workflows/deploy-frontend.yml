yaml
name: Deploy Frontend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-check
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ${{ secrets.FRONTEND_EC2_USERNAME }}
          key: ${{ secrets.FRONTEND_EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            echo "DEPLOYMENT STARTED: $(date)"

            APP_DIR="/var/www/frontend"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            mkdir -p "$APP_DIR"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              git clean -fd
            else
              find "$APP_DIR" -mindepth 1 -delete
              git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            npm ci
            VITE_API_URL=/api npm run build

            sleep 2
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health || echo "000")
            echo "Health check: HTTP $HTTP_STATUS"

            echo "DEPLOYMENT FINISHED: $(date)"